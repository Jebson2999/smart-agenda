<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B4336" />
    <title>Sem conexão — ASTRAL Smart Agenda</title>
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("/fonts/inter-400.woff") format("woff"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("/fonts/inter-600.woff") format("woff"); }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        background: #0B4336; color: #E5EFEA; font-family: Inter, system-ui, sans-serif; text-align: center;
      }
      main { max-width: 360px; }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { font-size: 22px; font-weight: 600; margin: 20px 0 8px; letter-spacing: -0.02em; }
      p { font-size: 15px; line-height: 1.55; color: #B9CEC5; margin: 0 0 24px; }
      button {
        font: inherit; font-weight: 600; font-size: 15px; color: #0B4336; background: #FFFFFF;
        border: 0; border-radius: 12px; height: 46px; padding: 0 22px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>A ASTRAL Smart Agenda precisa de internet para carregar compromissos atualizados. Os lembretes no WhatsApp continuam sendo enviados pelo servidor normalmente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
